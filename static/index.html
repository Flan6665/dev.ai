<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ишка</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #66707c; --border: #dde1e6;
    --accent: #3b6cf6; --accent-text: #ffffff; --user: #e8eefe; --think: #f1f2f4; --code: #0f1419; --code-text: #e6e1cf;
    --ok: #1f8a4c; --warn: #b5541a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a20; --text: #e7e9ec; --muted: #8b939e; --border: #2a2f37;
      --accent: #6b8cff; --accent-text: #0f1115; --user: #1e2840; --think: #1d2027; --code: #0a0c10; --code-text: #e6e1cf;
      --ok: #4cc27f; --warn: #f0a060;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0; }
  header .info { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 200px; }
  .msg { margin: 14px 0; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); overflow-wrap: anywhere; }
  .msg.user { background: var(--user); margin-left: 15%; }
  .msg .role { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .msg .body { white-space: pre-wrap; }
  details.think { background: var(--think); border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; color: var(--muted); font-size: 14px; }
  details.think summary { cursor: pointer; }
  details.think .body { white-space: pre-wrap; margin-top: 6px; }
  pre { background: var(--code); color: var(--code-text); padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: pre; font: 13px/1.45 ui-monospace, "SF Mono", Consolas, monospace; }
  .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  button { font: inherit; font-size: 14px; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  textarea { width: 100%; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; resize: vertical; }
  .editor { margin-top: 8px; }
  .editor label { font-size: 13px; color: var(--muted); display: block; margin: 6px 0 2px; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 10px 16px; }
  footer .inner { max-width: 860px; margin: 0 auto; }
  footer .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: var(--muted); }
  footer select, footer input[type=number] { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 2px 4px; }
  .train-box { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  progress { width: 120px; }
  .status { color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--warn); }
  .empty { text-align: center; color: var(--muted); margin-top: 60px; }
</style>
</head>
<body>
<header>
  <h1>🧠 Ишка</h1>
  <div class="info" id="info">загрузка…</div>
  <div class="train-box">
    <button id="trainBtn" title="Дообучить модель на сохранённых тобой примерах">Обучить на примерах (<span id="exCount">0</span>)</button>
    <progress id="trainProg" max="1" value="0" hidden></progress>
    <span class="status" id="trainStatus"></span>
  </div>
</header>

<main id="chat">
  <div class="empty" id="empty">
    Напиши задачу — Ишка ответит кодом.<br>
    Если ответ плохой, нажми «Исправить и научить», напиши правильный ответ, а потом «Обучить на примерах».
  </div>
</main>

<footer>
  <div class="inner">
    <textarea id="input" rows="3" placeholder="Например: напиши функцию на Rust, которая переворачивает строку (Ctrl+Enter — отправить)"></textarea>
    <div class="row">
      <button class="primary" id="sendBtn">Отправить</button>
      <button id="stopBtn" disabled>Стоп</button>
      <button id="clearBtn">Новый чат</button>
      <label>Размышления
        <select id="think">
          <option value="auto">сама решает</option>
          <option value="on">всегда думать</option>
          <option value="off">сразу отвечать</option>
        </select>
      </label>
      <label>Температура <input type="number" id="temp" min="0" max="2" step="0.1" value="0.7" style="width:60px"></label>
      <label>Макс. токенов <input type="number" id="maxTok" min="16" max="4096" step="16" value="512" style="width:72px"></label>
    </div>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const history = []; // {role, content, thinking}
let controller = null;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// Текст с блоками ```код``` → безопасный HTML.
function render(text) {
  const parts = text.split(/```/);
  return parts.map((p, i) => {
    if (i % 2 === 0) return `<span>${escapeHtml(p)}</span>`;
    const nl = p.indexOf("\n");
    const code = nl >= 0 && /^[\w+#.-]*$/.test(p.slice(0, nl).trim()) ? p.slice(nl + 1) : p;
    return `<pre><code>${escapeHtml(code)}</code></pre>`;
  }).join("");
}

function addMessage(msg, index) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + msg.role;
  el.innerHTML = `<div class="role">${msg.role === "user" ? "Ты" : "Ишка"}</div>` +
    (msg.role === "assistant" ? `<details class="think" hidden><summary>💭 Размышления</summary><div class="body"></div></details>` : "") +
    `<div class="body"></div>`;
  $("chat").appendChild(el);
  updateMessage(el, msg);
  if (msg.role === "assistant") addActions(el, index);
  return el;
}

function updateMessage(el, msg) {
  el.querySelector(":scope > .body").innerHTML = render(msg.content || "");
  const th = el.querySelector("details.think");
  if (th) {
    th.hidden = !msg.thinking;
    th.querySelector(".body").textContent = msg.thinking || "";
  }
}

function addActions(el, index) {
  const box = document.createElement("div");
  box.className = "actions";
  box.innerHTML = `<button data-a="good">👍 Хороший ответ — запомнить</button><button data-a="fix">✏️ Исправить и научить</button>`;
  el.appendChild(box);
  box.querySelector('[data-a="good"]').onclick = async (e) => {
    await teach(history.slice(0, index + 1));
    e.target.textContent = "✓ Запомнено";
    e.target.disabled = true;
  };
  box.querySelector('[data-a="fix"]').onclick = () => openEditor(el, index);
}

function openEditor(el, index) {
  if (el.querySelector(".editor")) return;
  const msg = history[index];
  const ed = document.createElement("div");
  ed.className = "editor";
  ed.innerHTML = `<label>Как надо было думать (необязательно)</label><textarea rows="3" class="th"></textarea>
    <label>Правильный ответ</label><textarea rows="8" class="ans"></textarea>
    <div class="actions"><button class="primary" data-a="save">Сохранить как пример</button><button data-a="cancel">Отмена</button></div>`;
  ed.querySelector(".th").value = msg.thinking || "";
  ed.querySelector(".ans").value = msg.content || "";
  el.appendChild(ed);
  ed.querySelector('[data-a="cancel"]').onclick = () => ed.remove();
  ed.querySelector('[data-a="save"]').onclick = async () => {
    const fixed = { role: "assistant", content: ed.querySelector(".ans").value, thinking: ed.querySelector(".th").value.trim() || null };
    history[index] = fixed;
    updateMessage(el, fixed);
    await teach(history.slice(0, index + 1));
    ed.remove();
  };
}

async function teach(messages) {
  const clean = messages.map((m) => ({ role: m.role, content: m.content, ...(m.thinking ? { thinking: m.thinking } : {}) }));
  const r = await fetch("/api/teach", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: clean }) });
  const j = await r.json();
  if (!r.ok) return setStatus(j.error || "Ошибка", "err");
  $("exCount").textContent = j.examples;
  setStatus("Пример сохранён", "ok");
}

async function send() {
  const text = $("input").value.trim();
  if (!text || controller) return;
  $("input").value = "";
  history.push({ role: "user", content: text });
  addMessage(history[history.length - 1], history.length - 1);
  const msg = { role: "assistant", content: "", thinking: "" };
  history.push(msg);
  const index = history.length - 1;
  const el = addMessage(msg, index);
  el.querySelector(".actions").hidden = true;
  const th = el.querySelector("details.think");

  controller = new AbortController();
  $("sendBtn").disabled = true;
  $("stopBtn").disabled = false;
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        messages: history.slice(0, -1).map((m) => ({ role: m.role, content: m.content, ...(m.thinking ? { thinking: m.thinking } : {}) })),
        think: $("think").value,
        params: { temperature: parseFloat($("temp").value), max_tokens: parseInt($("maxTok").value, 10) },
      }),
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i);
        buf = buf.slice(i + 2);
        const line = chunk.split("\n").find((l) => l.startsWith("data:"));
        if (!line) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === "phase" && ev.phase === "think") { th.hidden = false; th.open = true; }
        if (ev.type === "phase" && ev.phase === "answer") { th.open = false; }
        if (ev.type === "think") msg.thinking += ev.text;
        if (ev.type === "answer") msg.content += ev.text;
        if (ev.type === "error") msg.content += `\n⚠ ${ev.text}`;
        updateMessage(el, msg);
        if (msg.thinking) th.hidden = false;
        window.scrollTo(0, document.body.scrollHeight);
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") msg.content += `\n⚠ ${e.message}`;
    updateMessage(el, msg);
  } finally {
    controller = null;
    $("sendBtn").disabled = false;
    $("stopBtn").disabled = true;
    el.querySelector(".actions").hidden = false;
  }
}

function setStatus(text, cls = "") {
  const s = $("trainStatus");
  s.textContent = text;
  s.className = "status " + cls;
}

async function loadInfo() {
  const j = await (await fetch("/api/info")).json();
  const c = j.config || {};
  $("info").textContent = `${j.params} параметров · ${c.n_layers} слоёв · контекст ${c.max_seq_len} · ${j.device} · обучено шагов: ${j.pretrain_steps} (${j.tokens_seen} токенов)`;
  $("exCount").textContent = j.examples;
}

async function startTraining() {
  const steps = parseInt(prompt("Сколько шагов обучения? (больше — сильнее запомнит)", "60"), 10);
  if (!steps) return;
  const r = await fetch("/api/train", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ steps }) });
  const j = await r.json();
  if (!r.ok) return setStatus(j.error, "err");
  pollTraining();
}

async function pollTraining() {
  const s = await (await fetch("/api/status")).json();
  $("trainProg").hidden = !s.running;
  $("trainBtn").disabled = s.running;
  $("trainProg").max = s.total || 1;
  $("trainProg").value = s.step;
  const loss = s.loss != null ? ` · loss ${s.loss.toFixed(3)}` : "";
  setStatus(s.running ? `${s.message} ${s.step}/${s.total}${loss}` : s.message, s.message.startsWith("Ошибка") ? "err" : s.running ? "" : "ok");
  if (s.running) setTimeout(pollTraining, 1000);
  else loadInfo();
}

$("sendBtn").onclick = send;
$("stopBtn").onclick = () => controller?.abort();
$("clearBtn").onclick = () => { history.length = 0; $("chat").innerHTML = ""; };
$("trainBtn").onclick = startTraining;
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(); });
loadInfo();
pollTraining();
</script>
</body>
</html>
