[package]
name = "ishka"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
burn = { version = "0.22", features = ["wgpu", "flex", "store", "autodiff"] }
clap = { version = "4.6.7", features = ["derive"] }
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
walkdir = "2.5.0"
