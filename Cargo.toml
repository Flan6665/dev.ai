[package]
name = "ishka"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
candle-core = "0.11"
candle-nn = "0.11"
clap = { version = "4.6.7", features = ["derive"] }
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
walkdir = "2.5.0"

[features]
default = []
# Обучение и запуск на видеокарте NVIDIA (нужен CUDA Toolkit).
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
